services:
  redis:
    image: redis:7-alpine
    container_name: mediagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mediagent-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: mediagent-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./.env:/app/.env
    networks:
      - mediagent-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        - REACT_APP_API_URL=http://host.docker.internal:8000
    container_name: mediagent-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://host.docker.internal:8000
    depends_on:
      - backend
    networks:
      - mediagent-network

volumes:
  redis_data:

networks:
  mediagent-network:
    driver: bridge